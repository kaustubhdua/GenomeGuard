<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenomeGuard</title>
<meta name="description" content="A research prototype for genomic data access governance, disclosure-risk assessment, query monitoring, and auditable decisions.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fff' stroke='%23131a22' stroke-width='2'/%3E%3Ccircle cx='11' cy='16' r='4' fill='%234a47b0'/%3E%3Ccircle cx='21' cy='16' r='4' fill='%23c42b5c'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("gg_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="/static/src/style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="shell" id="shell">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/overview"><span class="mark" aria-hidden="true"></span>GenomeGuard</a>
    <div class="nav" id="nav"></div>
    <div class="who">
      <label for="who" id="who-label">Acting as</label>
      <select id="who"></select>
      <div id="auth-panel" hidden>
        <label for="auth-kind">Connect as</label>
        <select id="auth-kind">
          <option value="researcher">Researcher</option>
          <option value="steward">Data steward</option>
        </select>
        <label for="api-key-input" style="margin-top:8px">Issued API key</label>
        <input id="api-key-input" type="password" autocomplete="off" spellcheck="false" placeholder="Paste issued key">
        <button id="connect-key" type="button" style="width:100%;margin-top:8px">Connect</button>
        <button id="disconnect-key" class="ghost" type="button" style="width:100%;margin-top:6px">Disconnect</button>
        <p class="fine" id="auth-status" role="status" aria-live="polite"></p>
      </div>
      <p class="fine" id="who-note"></p>
      <p class="fine">Data and consent provenance are labelled in the interface. Use only datasets you are authorized to process.</p>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="iconbtn menubtn" id="menu" aria-label="Open menu">Menu</button>
      <div class="crumb" id="crumb">GenomeGuard</div>
      <a class="iconbtn prov" id="prov" href="#/overview" title="Where this data comes from"></a>
      <button class="iconbtn" id="open-cmdk" aria-label="Search Ctrl K">Search <span class="kbd">Ctrl K</span></button>
      <button class="iconbtn" id="theme" aria-label="Switch colour theme">Theme</button>
    </header>
    <main id="view" tabindex="-1"><div class="skeleton" style="height:120px"></div></main>
  </div>
</div>
<div class="cmdk-wrap" id="cmdk" role="dialog" aria-modal="true" aria-label="Search">
  <div class="cmdk">
    <input id="cmdk-input" type="text" placeholder="Go to a page or run an action" aria-label="Search" autocomplete="off">
    <ul id="cmdk-list" role="listbox"></ul>
  </div>
</div>
<script type="module" src="/static/src/main.js"></script>
</body>
</html>
