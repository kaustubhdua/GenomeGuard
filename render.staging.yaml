# Dedicated synthetic-only PR staging service. Production is not managed here.
services:
  - type: web
    name: genomeguard-staging-pr113
    runtime: docker
    plan: free
    region: singapore
    branch: feat/institutional-production-controls
    autoDeploy: true
    dockerfilePath: ./Dockerfile.staging
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: GG_DEMO_MODE
        value: "true"
      - key: GG_EXPOSE_DEMO_ADMIN_KEY
        value: "false"
      - key: GG_ALLOW_TAMPER_DEMO
        value: "false"
      - key: GG_DATASET_ID
        value: synthetic-cohort-1
      - key: GG_DATABASE_URL
        sync: false # Neon genomeguard_runtime role; never expose to browser
      - key: GG_MIGRATION_DATABASE_URL
        sync: false # distinct Neon genomeguard_owner role
      - key: GG_MASTER_KEY
        sync: false # unique 32-byte base64 key for synthetic staging
      - key: GG_ADMIN_API_KEY
        generateValue: true
