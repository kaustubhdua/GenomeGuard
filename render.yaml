# Render blueprint for the separate non-demo research-mode service. Do not apply this blueprint to the public synthetic demo service. The image builds a cohort from IGSR's
# public 1000 Genomes release and maps its published dataset-level use terms to DUO-inspired policy.
# This is NOT participant-specific consent or production healthcare readiness. Without a persistent
# disk, requests and audit history reset on deploy/restart; the readiness endpoint will remain 503.
services:
  - type: web
    name: genomeguard-research
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: GG_DEMO_MODE
        value: "false"  # Disable public demo credentials and simulated personas
      - key: GG_ALLOW_TAMPER_DEMO
        value: "false"  # Keep destructive audit-tampering demo disabled on hosted service
      - key: GG_REAL_COHORT_FILE
        value: /app/data_real/1000g_phase3_chr22.npz
      - key: GG_DATASET_ID
        value: igsr-1000g-phase3-public-release
      - key: GG_DATABASE_URL
        sync: false   # Restricted runtime-role URL; no schema ownership or migration privileges
      - key: GG_MIGRATION_DATABASE_URL
        sync: false   # Separate owner URL, used only during startup migrations and then closed
      - key: GG_OIDC_REQUIRED
        value: "true"
      - key: GG_OIDC_ADMIN_REQUIRED
        value: "true"
      - key: GG_TENANT_ISOLATION_REQUIRED
        value: "true"
      - key: GG_OIDC_ISSUER
        sync: false
      - key: GG_OIDC_AUDIENCE
        sync: false
      - key: GG_OIDC_CLIENT_ID
        sync: false
      - key: GG_OIDC_REDIRECT_URI
        sync: false
      - key: GG_OIDC_SCOPES
        value: "openid profile email"
      - key: GG_OIDC_JWKS_URL
        sync: false
      - key: GG_OIDC_ORGANIZATION_CLAIM
        value: organization_id
      - key: GG_OIDC_ALLOWED_ORGANIZATIONS
        sync: false
      - key: GG_CONSENT_AUTHORITY_REQUIRED
        value: "true"
      - key: GG_CONSENT_AUTHORITY_ISSUER
        sync: false
      - key: GG_CONSENT_AUTHORITY_PUBLIC_KEY
        sync: false
      - key: GG_MASTER_KEY
        sync: false   # set by hand: python -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
      - key: GG_ADMIN_API_KEY
        generateValue: true
