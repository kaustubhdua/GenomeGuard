name: FHIR R4 Consent validation

on:
  push:
    branches: [main, release/real-data-validation]
    paths:
      - "backend/app/service.py"
      - "backend/tests/test_fhir.py"
      - "scripts/export_fhir_fixture.py"
      - "fhir/ig/**"
      - ".github/workflows/fhir-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/app/service.py"
      - "backend/tests/test_fhir.py"
      - "scripts/export_fhir_fixture.py"
      - "fhir/ig/**"
      - ".github/workflows/fhir-validation.yml"
  workflow_dispatch:

concurrency:
  group: fhir-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fhir-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Build a synthetic Consent resource from the application
        run: |
          make setup
          PYTHONPATH=backend .venv/bin/python scripts/export_fhir_fixture.py --out /tmp/genomeguard-consent-r4.json
      - name: Download pinned HL7 FHIR Validator CLI
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/hapifhir/org.hl7.fhir.core/releases/download/7.0.1/validator_cli.jar \
            --output /tmp/validator_cli.jar
          echo "1178b6a3a3fe98d9cd9545cadee505274967332466001d857e4d8bed7138a5bc  /tmp/validator_cli.jar" | sha256sum --check
      - name: Validate the exported resource against FHIR R4
        run: |
          tar -czf /tmp/genomeguard-fhir-ig.tgz -C fhir/ig package
          java -jar /tmp/validator_cli.jar /tmp/genomeguard-consent-r4.json -version 4.0.1 -ig /tmp/genomeguard-fhir-ig.tgz
      - name: Prove the validator rejects a malformed Consent resource
        run: |
          PYTHONPATH=backend .venv/bin/python scripts/export_fhir_fixture.py \
            --invalid-status --out /tmp/genomeguard-consent-invalid.json
          set +e
          java -jar /tmp/validator_cli.jar /tmp/genomeguard-consent-invalid.json \
            -version 4.0.1 -ig /tmp/genomeguard-fhir-ig.tgz > /tmp/fhir-negative.log 2>&1
          validator_status=$?
          set -e
          if ! grep -qi "error" /tmp/fhir-negative.log; then
            cat /tmp/fhir-negative.log
            echo "Validator did not report an error for the deliberately invalid status (exit=$validator_status)"
            exit 1
          fi
          echo "PASS: HL7 validator rejected the intentionally malformed Consent fixture"
          grep -i "error" /tmp/fhir-negative.log | head -n 5
