name: ClinVar research baseline training

on:
  workflow_dispatch:
    inputs:
      confirm_public_data:
        description: Confirm this run uses only the public NCBI ClinVar variant_summary release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  train:
    if: ${{ inputs.confirm_public_data }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml]"
      - name: Download public ClinVar summary
        run: |
          mkdir -p .training-data artifacts/clinvar-baseline
          curl --fail --location --retry 3 \
            https://ftp.ncbi.nlm.nih.gov/pub/clinvar/tab_delimited/variant_summary.txt.gz \
            --output .training-data/variant_summary.txt.gz
          sha256sum .training-data/variant_summary.txt.gz | tee artifacts/clinvar-baseline/source.sha256
      - name: Train and evaluate gene-held-out baseline
        run: |
          python -m app.ml.clinvar_train \
            --input .training-data/variant_summary.txt.gz \
            --output-dir artifacts/clinvar-baseline
        env:
          PYTHONPATH: backend
      - name: Upload model and evaluation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: genomeguard-clinvar-research-baseline
          path: artifacts/clinvar-baseline/
          if-no-files-found: error
          retention-days: 30
