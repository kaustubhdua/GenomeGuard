name: live-research-mode-smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL of a separately provisioned non-demo research-mode deployment. Do not use the public synthetic demo."
        required: true
        type: string
      expected_commit:
        description: "Optional full commit SHA to require before acceptance."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: genomeguard-live-research-mode-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_URL: ${{ inputs.base_url }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/gg-axe --no-save --package-lock=false axe-core@4.14.0
      - name: Verify separate research-mode API, provenance, identity and consent gates
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          case "$BASE_URL" in
            https://genomeguard.onrender.com*)
              echo "Refusing to run research-mode acceptance against the public synthetic demo. Provision a separate research-mode service."
              exit 2
              ;;
            https://*) ;;
            *)
              echo "Research-mode acceptance requires an HTTPS deployment URL."
              exit 2
              ;;
          esac
          args=(--base "$BASE_URL" --retries 60 --retry-delay 15 --timeout 30)
          if [ -n "${EXPECTED_COMMIT:-}" ]; then
            args+=(--expected-commit "$EXPECTED_COMMIT")
          fi
          python scripts/live_research_mode_smoke.py "${args[@]}"
      - name: Verify nine live UI routes in light/dark themes and mobile widths
        run: python scripts/live_ui_smoke.py --base "${BASE_URL%/}" --timeout 60000
      - name: Verify live accessibility, keyboard, reduced motion, and reflow
        env:
          AXE_CORE_PATH: /tmp/gg-axe/node_modules/axe-core/axe.min.js
        run: python scripts/live_accessibility_smoke.py --base "${BASE_URL%/}" --timeout 60000
