name: ci
on:
  push:
    branches: [main, feat/institutional-production-controls]
  pull_request:
    branches: [main, feat/remove-supabase-runtime]
  workflow_dispatch:
concurrency:
  # A push to a PR head and the corresponding pull_request event must not run
  # the same expensive PostgreSQL suite twice in parallel.
  group: genomeguard-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: genomeguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genomeguard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: make setup
      - run: make lint
      - run: make seed
      - name: Run unit and API tests
        env:
          GG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genomeguard_test
        run: .venv/bin/python -m pytest -vv --durations=25 --ignore=backend/tests/test_postgres_integration.py
      - name: Run real PostgreSQL integration and tenant-isolation tests
        env:
          GG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genomeguard_test
          PYTEST_ADDOPTS: "-vv --durations=25"
        run: .venv/bin/python -m pytest -vv --durations=25 backend/tests/test_postgres_integration.py
      - name: Exercise encrypted PostgreSQL backup, restore and audit verification
        env:
          PGPASSWORD: postgres
          GG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/genomeguard_backup_source
          GG_RESTORE_TEST_URL: postgresql://postgres:postgres@localhost:5432/genomeguard_backup_restore
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client
          createdb --host=localhost --username=postgres genomeguard_backup_source
          createdb --host=localhost --username=postgres genomeguard_backup_restore
          PYTHONPATH=backend .venv/bin/python - <<'PY'
          from app.core.audit_chain import AuditChain
          from app.postgres_store import PostgresStore
          from app.store import AuditStore

          store = PostgresStore("postgresql://postgres:postgres@localhost:5432/genomeguard_backup_source")
          try:
              chain = AuditChain(AuditStore(store))
              chain.append("ci", "backup-test.created", {"fixture": "synthetic"})
              chain.append("ci", "backup-test.verified", {"fixture": "synthetic"})
          finally:
              store.close()
          PY
          age-keygen --output /tmp/genomeguard-age-identity.txt
          export GG_BACKUP_AGE_RECIPIENT="$(age-keygen --y /tmp/genomeguard-age-identity.txt)"
          export GG_BACKUP_AGE_IDENTITY_FILE=/tmp/genomeguard-age-identity.txt
          bash scripts/postgres_backup_restore_check.sh
      - run: make eval-smoke
      - run: make eval
      - run: make demo
      - run: for f in $(find frontend -name '*.js'); do node --check "$f" || exit 1; done
      - name: Compile all Python application and script files
        run: .venv/bin/python -m compileall -q backend scripts
      - name: Install browser smoke-test dependencies
        run: |
          .venv/bin/pip install playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Install pinned axe-core accessibility rules
        run: npm install --prefix /tmp/gg-axe --no-save --package-lock=false axe-core@4.14.0
      - name: Test all pages, responsive layouts, accessibility basics and guided tour
        env:
          AXE_CORE_PATH: /tmp/gg-axe/node_modules/axe-core/axe.min.js
          UI_SCREENSHOT_DIR: /tmp/genomeguard-ui-screenshots
        run: make ui-smoke
      - name: Preserve UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genomeguard-ui-review-${{ github.sha }}
          path: /tmp/genomeguard-ui-screenshots/
          if-no-files-found: warn
          retention-days: 14
