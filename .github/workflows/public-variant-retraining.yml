name: Public variant data integration and retraining

on:
  workflow_dispatch:
    inputs:
      confirm_public_data:
        description: Confirm download and processing of public ClinVar and Ensembl VEP data
        required: true
        type: boolean
        default: false
  push:
    branches:
      - ml/public-annotations-retraining
    paths:
      - .github/workflows/public-variant-retraining.yml

permissions:
  contents: read

jobs:
  train:
    if: ${{ github.event_name == 'push' || inputs.confirm_public_data }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml]"
      - name: Download, integrate, train and evaluate public annotations
        run: |
          PYTHONPATH=backend python -m app.ml.clinvar_vep_train --max-variants 10000
      - name: Upload model, metrics, provenance and annotation cache
        uses: actions/upload-artifact@v4
        with:
          name: genomeguard-public-variant-research-model
          path: |
            artifacts/clinvar-vep/
            .training-data/public-annotations/ensembl_vep_annotations.jsonl
          if-no-files-found: error
          retention-days: 30
