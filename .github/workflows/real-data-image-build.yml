name: real-data-image-build
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "backend/requirements.txt"
      - "backend/app/data/**"
      - "backend/app/core/**"
      - "docs/policies/igsr-1000-genomes-public-release.json"
      - ".github/workflows/real-data-image-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "backend/requirements.txt"
      - "backend/app/data/**"
      - "backend/app/core/**"
      - "docs/policies/igsr-1000-genomes-public-release.json"
      - ".github/workflows/real-data-image-build.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeguard-real-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # The verified IGSR VCF download + normalization has taken ~103 minutes on Render.
    # Keep CI alive long enough to finish the same reproducible real-data build.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - name: Build image and fetch the official public genotype source
        run: docker build --build-arg GENOMEGUARD_COHORT_BUILD_REV="$GITHUB_SHA" --tag genomeguard-real-research:ci .
      - name: Verify image contains real genotype provenance and explicit source policy
        run: |
          docker run --rm --entrypoint python genomeguard-real-research:ci -c '
          import json
          from app.data.real import read_meta
          m = read_meta("/app/data_real/1000g_phase3_chr22.npz")
          assert m.get("genotypes_real") is True, m
          assert m.get("consent_simulated") is False, m
          assert m.get("consent_basis") == "dataset_policy", m
          assert m.get("consent_policy", {}).get("not_individual_consent") is True, m
          assert m.get("consent_records_matched") == 0, m
          assert m.get("dataset_policy_samples_scoped") == m.get("samples"), m
          assert m.get("consent_source_file") is None, m
          assert m.get("consent_records_sha256") is None, m
          assert len(m.get("source_vcf_sha256", "")) == 64, m
          assert len(m.get("consent_policy_source_sha256", "")) == 64, m
          print(json.dumps({k:m.get(k) for k in ("source", "samples", "variants",
            "genotypes_real", "consent_simulated", "consent_basis",
            "consent_records_matched", "dataset_policy_samples_scoped",
            "source_vcf_sha256", "consent_policy_source_sha256")}, indent=2))
          '
      - name: Confirm raw downloaded genotype files were not retained in the image
        run: |
          docker run --rm --entrypoint sh genomeguard-real-research:ci -c '
          test ! -e /app/data_real/chr22.vcf.gz
          test ! -e /app/data_real/samples.ped
          '
