name: live-browser-accessibility-acceptance
on:
  push:
    branches: [test/live-browser-accessibility-acceptance-20261114]
    paths:
      - "frontend/**"
      - "backend/app/api.py"
      - "scripts/live_ui_smoke.py"
      - "scripts/live_accessibility_smoke.py"
      - ".github/workflows/live-browser-accessibility.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public synthetic-demo URL to verify"
        required: true
        default: "https://genomeguard.onrender.com"
        type: string
permissions:
  contents: read
concurrency:
  group: genomeguard-live-browser-accessibility
  cancel-in-progress: false
jobs:
  browser-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://genomeguard.onrender.com' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium
      - name: Verify live researcher routes, themes and responsive layouts
        run: python scripts/live_ui_smoke.py --base "$BASE_URL" --timeout 60000
      - name: Install pinned axe-core accessibility rules
        run: npm install --prefix /tmp/gg-axe --no-save --package-lock=false axe-core@4.14.0
      - name: Verify live accessibility, keyboard, reduced motion and 200 percent reflow
        env:
          AXE_CORE_PATH: /tmp/gg-axe/node_modules/axe-core/axe.min.js
        run: python scripts/live_accessibility_smoke.py --base "$BASE_URL" --timeout 60000
