name: Real-data validation (1000 Genomes)

on:
  push:
    branches: [release/real-data-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and run baseline quality gates
        run: |
          make setup
          make lint
          make test
      - name: Download and build a real 1000 Genomes Phase 3 cohort
        run: make fetch-real
      - name: Evaluate the real cohort
        run: make eval-real COHORT=data_real/1000g_chr22.npz
      - name: Verify generated provenance and aggregate evaluation report
        run: |
          PYTHONPATH=backend .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from app.data.real import read_meta
          p = Path("data_real/1000g_chr22.npz")
          m = read_meta(p)
          assert m.get("genotypes_real") is True, m
          assert m.get("consent_simulated") is True, m
          assert len(m.get("source_vcf_sha256", "")) == 64, m
          assert len(m.get("source_pedigree_sha256", "")) == 64, m
          assert m.get("samples", 0) >= 30 and m.get("variants", 0) > 0, m
          assert m.get("relative_pairs", 0) == 0, "Phase 3 panel should not imply pedigree relationships"
          assert m.get("family_enriched") is False, "unrelated Phase 3 panel must not be labelled family-enriched"
          report = Path("docs/eval-results-real.md")
          assert report.is_file() and report.stat().st_size > 0, "real evaluation report missing"
          print(json.dumps({k: m[k] for k in ("source", "samples", "variants", "relative_pairs",
              "genotypes_real", "consent_simulated", "family_enriched", "source_vcf_file",
              "source_vcf_sha256", "source_pedigree_sha256", "build_parameters")}, indent=2))
          print(f"real evaluation report: {report} ({report.stat().st_size} bytes)")
          PY
      - name: Preserve aggregate evaluation report (never raw genomic data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genomeguard-real-data-evaluation
          path: docs/eval-results-real.md
          if-no-files-found: warn
          retention-days: 7
