name: Deployment configuration checks

on:
  pull_request:
    branches: [main, feat/remove-supabase-runtime]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate Vercel configuration and frontend asset references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const config = JSON.parse(fs.readFileSync('frontend/vercel.json', 'utf8'));
          if (!Array.isArray(config.rewrites) || config.rewrites.length < 2) {
            throw new Error('Vercel must keep the static alias and API fallback rewrites.');
          }
          const alias = config.rewrites.find((r) => r.source === '/static/:path*');
          if (!alias || alias.destination !== '/:path*') {
            throw new Error('Static alias must map /static/src/* to /src/*.');
          }
          const fallback = config.rewrites.find((r) => r.source === '/(.*)');
          if (!fallback || fallback.destination !== 'https://genomeguard.onrender.com/$1') {
            throw new Error('API fallback must point to the first-party GenomeGuard API.');
          }
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="\/static\/([^"]+)"/g)].map((m) => m[1]);
          for (const ref of refs) {
            const target = path.join('frontend', ref);
            if (!fs.existsSync(target)) throw new Error('Missing frontend asset: ' + target);
          }
          console.log('Vercel JSON valid; static asset references exist:', refs.join(', '));
          NODE
      - name: Validate native PostgreSQL migrations and deployment profile
        run: |
          test -s backend/migrations/001_initial_postgres.sql
          test -s backend/migrations/002_normalized_public_references.sql
          grep -q 'GG_DATABASE_URL' backend/app/config.py
          grep -q 'GG_DATABASE_URL' docker-compose.postgres.yml
          grep -q 'genomeguard_runtime' backend/app/postgres_store.py
          grep -q 'genomeguard.population_variant_frequency' backend/migrations/002_normalized_public_references.sql
          ! grep -R -E 'supabase\.co|SUPABASE_|/functions/v1/|/auth/v1/' frontend/src
      - name: Verify native database migration runner covers all numbered files
        run: |
          grep -Fq '_MIGRATIONS.glob("[0-9][0-9][0-9]_*.sql")' backend/app/postgres_store.py
          grep -q 'schema_migrations' backend/app/postgres_store.py
      - name: Validate separate public-demo and research-mode deployment targets
        run: |
          ruby -e '
            require "yaml"
            config = YAML.safe_load_file("render.yaml", permitted_classes: [], permitted_symbols: [], aliases: false)
            services = config.fetch("services")
            raise "research blueprint must define exactly one service" unless services.length == 1
            service = services.first
            raise "research blueprint must use a distinct service name" unless service["name"] == "genomeguard-research"
            raise "research blueprint must use the dedicated real-cohort Dockerfile" unless service["dockerfilePath"] == "./Dockerfile.research"
            public_image = File.read("Dockerfile")
            raise "public demo image must not build or embed a real cohort" if public_image.match?(/app\.data\.real build|GG_REAL_COHORT_FILE|data_real/)
            raise "public demo image must explicitly use synthetic demo mode" unless public_image.include?("GG_DEMO_MODE=true") && public_image.include?("GG_DATASET_ID=synthetic-cohort-1")
            research_image = File.read("Dockerfile.research")
            raise "research image must build the documented public cohort" unless research_image.include?("app.data.real build") && research_image.include?("GG_REAL_COHORT_FILE=/app/data_real/1000g_phase3_chr22.npz")
            raise "research blueprint must use /health/live" unless service["healthCheckPath"] == "/health/live"
            env = service.fetch("envVars").to_h { |entry| [entry.fetch("key"), entry] }
            raise "research mode must disable demo sessions" unless env.dig("GG_DEMO_MODE", "value") == "false"
            raise "research mode must require OIDC" unless env.dig("GG_OIDC_REQUIRED", "value") == "true"
            raise "research mode must require tenant isolation" unless env.dig("GG_TENANT_ISOLATION_REQUIRED", "value") == "true"
            raise "research mode must require consent authority" unless env.dig("GG_CONSENT_AUTHORITY_REQUIRED", "value") == "true"
            raise "research mode must require OIDC admin identity" unless env.dig("GG_OIDC_ADMIN_REQUIRED", "value") == "true"
            raise "tamper demo must be disabled" unless env.dig("GG_ALLOW_TAMPER_DEMO", "value") == "false"
            raise "runtime database URL must remain a manual secret" unless env.dig("GG_DATABASE_URL", "sync") == false
            raise "migration database URL must remain a manual secret" unless env.dig("GG_MIGRATION_DATABASE_URL", "sync") == false
            raise "master key must remain a manual secret" unless env.dig("GG_MASTER_KEY", "sync") == false
            %w[GG_OIDC_ISSUER GG_OIDC_AUDIENCE GG_OIDC_CLIENT_ID GG_OIDC_REDIRECT_URI GG_OIDC_JWKS_URL GG_OIDC_ALLOWED_ORGANIZATIONS GG_CONSENT_AUTHORITY_ISSUER GG_CONSENT_AUTHORITY_PUBLIC_KEY].each do |key|
              raise "#{key} must remain a manual secret" unless env.dig(key, "sync") == false
            end
            puts "Research-mode blueprint is distinct from the public synthetic demo and fails closed by default."
          '
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const workflow = fs.readFileSync('.github/workflows/live-research-mode-smoke.yml', 'utf8');
          if (/^  push:/m.test(workflow)) throw new Error('Live research-mode smoke must not run against the public demo on every main push.');
          if (!workflow.includes('workflow_dispatch:') || !workflow.includes('required: true')) throw new Error('Research-mode smoke must require an explicit deployment URL.');
          if (!workflow.includes('https://genomeguard.onrender.com')) throw new Error('Research-mode smoke must explicitly guard against the public demo URL.');
          const publicDemo = fs.readFileSync('.github/workflows/live-acceptance.yml', 'utf8');
          if (!publicDemo.includes('https://genomeguard.onrender.com')) throw new Error('Public synthetic-demo acceptance must retain its own target.');
          console.log('Live research-mode acceptance is manually targeted and cannot collide with public synthetic-demo acceptance.');
          NODE
      - name: Validate isolated Render staging blueprint
        run: |
          ruby -e '
            require "yaml"
            # Safe loading avoids Ruby object deserialization from repository YAML.
            config = YAML.safe_load_file("render.staging.yaml", permitted_classes: [], permitted_symbols: [], aliases: false)
            services = config.fetch("services")
            raise "staging blueprint must define exactly one service" unless services.length == 1
            service = services.first
            raise "staging service must use the PR branch" unless service["branch"] == "fix/main-release-acceptance-blockers"
            raise "staging service must be a separate free Singapore Docker service" unless
              service["name"] == "genomeguard-staging-pr122" && service["plan"] == "free" &&
              service["region"] == "singapore" && service["runtime"] == "docker"
            raise "staging auto-deploy must remain disabled" unless service["autoDeploy"] == true
            raise "staging health check must use liveness only" unless service["healthCheckPath"] == "/health/live"
            env = service.fetch("envVars").to_h { |entry| [entry.fetch("key"), entry] }
            raise "staging must use synthetic demo mode" unless env.dig("GG_DEMO_MODE", "value") == "true"
            raise "staging must not load the real cohort artifact" if env.key?("GG_REAL_COHORT_FILE")
            raise "staging dataset ID must remain synthetic" unless env.dig("GG_DATASET_ID", "value") == "synthetic-cohort-1"
            raise "tamper demo must remain disabled" unless env.dig("GG_ALLOW_TAMPER_DEMO", "value") == "false"
            raise "database URL must be a manual secret" unless env.dig("GG_DATABASE_URL", "sync") == false
            raise "migration URL must be a manual secret" unless env.dig("GG_MIGRATION_DATABASE_URL", "sync") == false
            raise "master key must be a manual secret" unless env.dig("GG_MASTER_KEY", "sync") == false
            raise "admin key must be generated by Render" unless env.dig("GG_ADMIN_API_KEY", "generateValue") == true
            puts "Render staging blueprint is isolated, synthetic-only, and has no checked-in secrets."
          '
