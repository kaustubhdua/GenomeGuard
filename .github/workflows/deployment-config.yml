name: Deployment configuration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate Vercel configuration and frontend asset references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const config = JSON.parse(fs.readFileSync('frontend/vercel.json', 'utf8'));
          if (!Array.isArray(config.rewrites) || config.rewrites.length < 2) {
            throw new Error('Vercel must keep the static alias and API fallback rewrites.');
          }
          const alias = config.rewrites.find((r) => r.source === '/static/:path*');
          if (!alias || alias.destination !== '/:path*') {
            throw new Error('Static alias must map /static/src/* to /src/*.');
          }
          const fallback = config.rewrites.find((r) => r.source === '/(.*)');
          if (!fallback || fallback.destination !== 'https://genomeguard.onrender.com/$1') {
            throw new Error('API fallback must point to the first-party GenomeGuard API.');
          }
          const html = fs.readFileSync('frontend/index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)="\/static\/([^"]+)"/g)].map((m) => m[1]);
          for (const ref of refs) {
            const target = path.join('frontend', ref);
            if (!fs.existsSync(target)) throw new Error('Missing frontend asset: ' + target);
          }
          console.log('Vercel JSON valid; static asset references exist:', refs.join(', '));
          NODE
      - name: Validate native PostgreSQL migrations and deployment profile
        run: |
          test -s backend/migrations/001_initial_postgres.sql
          test -s backend/migrations/002_normalized_public_references.sql
          grep -q 'GG_DATABASE_URL' backend/app/config.py
          grep -q 'GG_DATABASE_URL' docker-compose.postgres.yml
          grep -q 'genomeguard_runtime' backend/app/postgres_store.py
          grep -q 'genomeguard.population_variant_frequency' backend/migrations/002_normalized_public_references.sql
          ! grep -R -E 'supabase\.co|SUPABASE_|/functions/v1/|/auth/v1/' frontend/src
      - name: Verify native database migration runner covers all numbered files
        run: |
          grep -Fq '_MIGRATIONS.glob("[0-9][0-9][0-9]_*.sql")' backend/app/postgres_store.py
          grep -q 'schema_migrations' backend/app/postgres_store.py
      - name: Validate isolated Render staging blueprint
        run: |
          ruby -e '
            require "yaml"
            config = YAML.load_file("render.staging.yaml")
            services = config.fetch("services")
            raise "staging blueprint must define exactly one service" unless services.length == 1
            service = services.first
            raise "staging service must use the PR branch" unless service["branch"] == "feat/remove-supabase-runtime"
            raise "staging service must be a separate free Singapore Docker service" unless
              service["name"] == "genomeguard-staging" && service["plan"] == "free" &&
              service["region"] == "singapore" && service["runtime"] == "docker"
            raise "staging auto-deploy must remain disabled" unless service["autoDeploy"] == false
            raise "staging health check must use liveness only" unless service["healthCheckPath"] == "/health/live"
            env = service.fetch("envVars").to_h { |entry| [entry.fetch("key"), entry] }
            raise "staging must use synthetic demo mode" unless env.dig("GG_DEMO_MODE", "value") == "true"
            raise "staging must not load the real cohort artifact" unless env.dig("GG_REAL_COHORT_FILE", "value") == ""
            raise "staging dataset ID must remain synthetic" unless env.dig("GG_DATASET_ID", "value") == "synthetic-cohort-1"
            raise "tamper demo must remain disabled" unless env.dig("GG_ALLOW_TAMPER_DEMO", "value") == "false"
            raise "database URL must be a manual secret" unless env.dig("GG_DATABASE_URL", "sync") == false
            raise "master key must be a manual secret" unless env.dig("GG_MASTER_KEY", "sync") == false
            raise "admin key must be generated by Render" unless env.dig("GG_ADMIN_API_KEY", "generateValue") == true
            puts "Render staging blueprint is isolated, synthetic-only, and has no checked-in secrets."
          '
