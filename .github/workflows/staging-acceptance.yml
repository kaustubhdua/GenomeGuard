name: staging-acceptance
on:
  push:
    branches: [feat/institutional-production-controls]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/staging_smoke.py"
      - "scripts/live_ui_smoke.py"
      - "Dockerfile.staging"
      - "render.staging.yaml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/staging-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeguard-staging-acceptance
  cancel-in-progress: true
jobs:
  staging:
    name: Shared synthetic staging environment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # This shared Render service is pinned to the dedicated staging branch, not the PR branch.
      # The PR's exact code is exercised by CI; this job checks the shared staging environment
      # without waiting for an impossible PR-commit match.
      - name: Verify shared staging API, database, authorization, provenance and audit
        run: python scripts/staging_smoke.py --base https://genomeguard-staging-pr113.onrender.com --timeout 30
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify hosted public UI routes and mobile layouts
        run: python scripts/live_ui_smoke.py --base https://genomeguard-staging-pr113.onrender.com --timeout 30000
