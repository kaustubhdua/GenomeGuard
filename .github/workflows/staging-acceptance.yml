name: staging-acceptance
on:
  push:
    branches: [feat/institutional-production-controls, fix/main-release-acceptance-blockers]
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/staging_smoke.py"
      - "scripts/live_ui_smoke.py"
      - "Dockerfile.staging"
      - "render.staging.yaml"
      - "README.md"
      - "docs/**"
      - ".github/workflows/staging-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeguard-staging-acceptance-pr122
  cancel-in-progress: false
jobs:
  staging:
    name: PR-branch synthetic staging environment acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # This dedicated Render service is linked to fix/main-release-acceptance-blockers.
      # It deploys the exact PR branch, so this acceptance job exercises the release candidate itself.
      - name: Verify PR-branch staging API, database, authorization, provenance and audit
        run: python scripts/staging_smoke.py --timeout 30
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify hosted public UI routes and mobile layouts
        run: python scripts/live_ui_smoke.py --base https://genomeguard-staging-pr122.onrender.com --timeout 30000
