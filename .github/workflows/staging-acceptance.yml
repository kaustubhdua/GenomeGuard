name: staging-acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/staging_smoke.py"
      - "scripts/live_ui_smoke.py"
      - "Dockerfile.staging"
      - "render.staging.yaml"
      - ".github/workflows/staging-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeguard-staging-acceptance
  cancel-in-progress: true
jobs:
  staging:
    name: Read-only synthetic staging acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify live API, database, authorization, provenance and audit
        run: python scripts/staging_smoke.py --base https://genomeguard-staging.onrender.com --timeout 30 --expected-commit "$EXPECTED_COMMIT" --retries 60 --retry-delay 15
      - name: Install browser acceptance dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify hosted public UI routes and mobile layouts
        run: python scripts/live_ui_smoke.py --base https://genomeguard-staging.onrender.com --timeout 30000
