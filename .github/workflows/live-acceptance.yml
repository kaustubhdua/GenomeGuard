name: live-synthetic-demo-acceptance
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/live_synthetic_demo_smoke.py"
      - ".github/workflows/live-acceptance.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genomeguard-live-synthetic-demo
  cancel-in-progress: false
jobs:
  public-synthetic-demo:
    name: Free public synthetic demo acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify live demo, PostgreSQL persistence, audit integrity, and fail-closed readiness
        run: python scripts/live_synthetic_demo_smoke.py --base https://genomeguard.onrender.com
