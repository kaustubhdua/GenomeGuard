# One service: the API also serves the frontend. Synthetic data, demo mode on.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      GG_DEMO_MODE: "true"
      GG_ALLOW_TAMPER_DEMO: "true"          # lets the Audit page's tamper button work
      GG_ADMIN_API_KEY: "${GG_ADMIN_API_KEY:-demo-admin-key}"
      GG_MASTER_KEY: "${GG_MASTER_KEY:-}"   # unset = insecure development key (warning logged)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"   # optional; templates are used when empty
    volumes: ["gg-data:/data"]
volumes:
  gg-data:
