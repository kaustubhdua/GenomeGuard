[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeguard"
version = "0.1.0"
description = "Consent-aware, relative-aware governance and security layer for genomic data (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.27",
    "numpy>=1.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.26", "jsonschema>=4.22,<5"]
llm = ["anthropic>=0.30"]
synth = ["msprime>=1.3"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is a style preference; long prose lines and docstrings are tolerated.
ignore = ["E501"]
